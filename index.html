<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Engineering Metrics Form</title>
<style>
  :root {
    --ink: #16202c;
    --muted: #5a6a7a;
    --rule: #d6dde5;
    --bg: #ffffff;
    --panel: #f6f8fa;
    --accent: #1f5fa9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 1rem 4rem;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header, main, footer { max-width: 46rem; margin: 0 auto; }
  header { padding: 2rem 0 1rem; }
  h1 { margin: 0 0 .25rem; font-size: 1.75rem; }
  .note {
    margin: .25rem 0 1rem;
    padding: .6rem .8rem;
    border-left: 3px solid var(--accent);
    background: var(--panel);
    color: var(--muted);
    font-size: .875rem;
  }
  label { font-weight: 600; font-size: .9rem; }
  .hint { color: var(--muted); font-size: .8rem; font-weight: 400; }
  textarea { min-height: 4.5rem; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .choices { display: flex; flex-direction: column; gap: .4rem; margin: .35rem 0 .5rem; }
  .choices label { font-weight: 400; display: inline-flex; align-items: center; gap: .35rem; }
  .required { color: #a3231f; }
  table { width: 100%; border-collapse: collapse; margin: .5rem 0 1rem; font-size: .9rem; }
  th, td { border: 1px solid var(--rule); padding: .4rem .5rem; text-align: left; vertical-align: middle; }
  th { background: var(--panel); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  td select, td input { margin: 0; }
  .actions { margin: 2rem 0 0; padding: 1.25rem; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
  button { padding: .6rem 1.25rem; font: inherit; font-weight: 600; border-radius: 4px; cursor: pointer; }
  button[type="submit"] { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  button[type="reset"], button[type="button"] { background: #fff; color: var(--ink); border: 1px solid var(--rule); }
  footer { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .85rem; }
  a { color: var(--accent); }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8edf2; --muted: #9fb0c0; --rule: #33404e; --bg: #131a21; --panel: #1b242d; --accent: #7fb2ee; }
    input[type="text"], input[type="email"], input[type="url"], input[type="date"],
    input[type="number"], input[type="time"], select, textarea { background: #0f1519; }
    button[type="reset"], button[type="button"] { background: #0f1519; }
    button[type="submit"] { color: #0b1117; }
  }
</style>
</head>

<body>

<main>

<h1>Software engineering metrics form</h1>

<p>Complete as much as you reasonably can, using whatever reasonable estimates or metrics you have.</p>

<form action="/metrics/submissions" method="post" accept-charset="utf-8">

<p>
  <label for="email">Your email address?</label>
  <br>
  <input
    type="email"
    id="email"
    name="email"
    required
    placeholder="ann.adams@example.com"
    style="width: 100%;"
  />
</p>

<p>
  <label for="which_organization">Which organization / office / outfit / etc.?</label>
  <br>
  <input
    type="text"
    id="which_organization"
    name="which_organization"
    required
    placeholder="ACME Incorporated" 
    style="width: 100%;" 
  />
</p>

<p>
  <label for="which_department">Which department / division / directorate / etc.?</label>
  <br>
  <input
    type="text"
    id="which_department"
    name="which_department"
    required
    placeholder="Production Department" 
    style="width: 100%;" 
  />
</p>

<p>
  <label for="which_plan">Which plan / project / product / practice / etc.?</label>
  <br>
  <input
    type="text"
    id="which_plan"
    name="which_plan"
    required
    placeholder="Phoenix Project" 
    style="width: 100%;" 
  />
</p>

<p>
  <label for="which_task">Which task / todo / topic / etc.?</label>
  <br>
  <input
    type="text"
    id="which_task"
    name="which_task"
    required
    placeholder="Implement Feature X" 
    style="width: 100%;" 
  />
</p>

<p>
  <label for="which_stage">Which phase / stage / queue / etc.?</label>
  <br>
  <input
    type="text"
    id="which_stage"
    name="which_stage"
    required
    placeholder="User Acceptance Testing" 
    style="width: 100%;" 
  />
</p>

<p>
  <label for="which_status">What status / step / change / etc.?</label>
  <br>
  <input
    type="text"
    id="which_status"
    name="which_status"
    required
    placeholder="Start" 
    style="width: 100%;" 
  />
</p>

<p>
  <label for="when">When is this occuring?</label>
  <br>
  <input
    type="datetime-local"
    id="when"
    name="when"
    required
  />
</p>

<p>
  <label for="collection_method">Collection method?</label>
  <br>
  <select id="collection_method" name="collection_method">
    <option value="">Select a method</option>
    <option value="estimate">Estimate</option>
    <option value="manual">Manual collection</option>
    <option value="assisted">Assisted collection (some manual, some automated)</option>
    <option value="automated">Automated collection</option>
  </select>
</p>

<p>
  <label for="confidence">Confidence in this information?</label>
  <br>
  <select id="confidence" name="confidence">
    <option value=""></option>
    <option value="low">Low: known gaps, or unverified, etc.</option>
    <option value="medium">Medium: spot-checked, or some proofing, etc.</option>
    <option value="high">High: verified, or audited, or confirmed, etc.</option>
  </select>
</p>

<p>
  <label for="source_notes">Any source-of-truth notes?</label>
  <br>
  <textarea id="source_notes" name="source_notes" style="width: 100%;"></textarea>
</p>

<p>
  <button type="button" id="export">Export TSV</button>
  <button type="reset">Clear the form</button>
</p>

</form>

<script>
const STORAGE_KEY = "software-engineering-metrics-form";
const form = document.querySelector("form");

function toDatetimeLocalString(date) {
  const localDate = new Date(date - date.getTimezoneOffset() * 60000); //offset in milliseconds
  localDate.setSeconds(null);
  localDate.setMilliseconds(null);
  return localDate.toISOString().slice(0, -1);
}

// Every named control, in document order, one entry per name. Checkboxes
// sharing a name collapse into one entry holding each checked value.
function collectFields() {
  const order = [];
  const values = {};
  for (const element of form.elements) {
    const name = element.name;
    if (!name || element.disabled) continue;
    if (["submit", "reset", "button"].includes(element.type)) continue;
    if (!(name in values)) {
      order.push(name);
      values[name] = element.type === "checkbox" ? [] : "";
    }
    if (element.type === "checkbox") {
      if (element.checked) values[name].push(element.value);
    } else if (element.type === "radio") {
      if (element.checked) values[name] = element.value;
    } else {
      values[name] = element.value;
    }
  }
  return { order, values };
}

// A tab-separated field cannot hold a literal tab or newline, and the
// textareas can hold both, so escape them reversibly rather than lose text.
function escapeCell(value) {
  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/\t/g, "\\t")
    .replace(/\r\n?|\n/g, "\\n");
}

// One header row of field names, one row of values: the shape that appends
// cleanly into a spreadsheet as submissions accumulate over time.
function toTSV() {
  const { order, values } = collectFields();
  const header = order.map(escapeCell).join("\t");
  const row = order
    .map((name) => {
      const value = values[name];
      return escapeCell(Array.isArray(value) ? value.join("|") : value);
    })
    .join("\t");
  return `${header}\n${row}\n`;
}

function exportFilename() {
  const slug = [form.elements.which_plan?.value, form.elements.which_task?.value]
    .filter(Boolean)
    .join(" ")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
  return slug ? `metrics-${slug}.tsv` : "metrics.tsv";
}

function exportFile() {
  const blob = new Blob([toTSV()], {
    type: "text/tab-separated-values;charset=utf-8",
  });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = exportFilename();
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(collectFields().values));
  } catch (error) {
    console.warn("Could not save the form in this browser:", error);
  }
}

function restoreFromStorage() {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  } catch (error) {
    console.warn("Could not read the saved form:", error);
  }
  if (!saved) return;
  for (const element of form.elements) {
    if (!element.name || !(element.name in saved)) continue;
    const value = saved[element.name];
    if (element.type === "checkbox") {
      element.checked = Array.isArray(value) && value.includes(element.value);
    } else if (element.type === "radio") {
      element.checked = value === element.value;
    } else if (!["submit", "reset", "button"].includes(element.type)) {
      element.value = value;
    }
  }
}

function clearStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (error) {
    console.warn("Could not clear the saved form:", error);
  }
}

let saveTimer = null;
form.addEventListener("input", () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToStorage, 250);
});
form.addEventListener("change", saveToStorage);
form.addEventListener("reset", () => {
  clearTimeout(saveTimer);
  clearStorage();
});

document.getElementById("export").addEventListener("click", exportFile);

window.addEventListener("load", () => {
  restoreFromStorage();
  // Default to now, but never overwrite a restored answer.
  const when = document.getElementById("when");
  if (!when.value) when.value = toDatetimeLocalString(new Date());
});
</script>

</body>
</html>
